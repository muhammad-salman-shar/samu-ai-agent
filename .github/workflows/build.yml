name: Build NovaAgent Local APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Clean Previous Build Artifacts and Gradle Cache
        run: |
          flutter clean
          rm -rf android/.gradle
          rm -rf \~/.gradle/caches
          flutter pub get

      - name: Grant Gradlew Permissions
        run: chmod +x android/gradlew || true

      - name: Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaAgent-Local-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
