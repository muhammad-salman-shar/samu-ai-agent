name: Build NovaAgent Local APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code 🛎️
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin) ☕
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter Stable 🚀
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Tooling Versions 📋
        run: |
          java -version
          flutter doctor -v

      - name: Force Upgrade Gradle Wrapper to 8.7 ⚙️
        run: |
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Flutter Dependencies 📦
        run: flutter pub get

      - name: Grant Gradlew Execution Permissions 🔑
        run: chmod +x android/gradlew || true

      - name: Build Debug APK 🏗️
        run: flutter build apk --debug

      - name: Upload APK to Artifacts 📤
        uses: actions/upload-artifact@v4
        with:
          name: NovaAgent-Local-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
